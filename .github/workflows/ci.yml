name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each check reports its own result rather than the job stopping at the
  # first failure, so one run tells you everything that is wrong. The gate
  # below is what actually fails the build.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test
            run: go test ./...
          - name: test-race
            run: go test -race ./...
          - name: build
            run: go build ./...
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: Rethunk-Tech/gh-actions/setup-go@45d60bff5148282bbbf11e6f2460829eab772cf2 # v1.9
        with:
          go-version-file: go.mod
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # govulncheck is on here, not merely available: this repo's own doctor
      # flags Go projects that leave it off, and shipping a tool that gives
      # advice it does not take would be the wrong kind of example.
      - uses: Rethunk-Tech/gh-actions/setup-go@45d60bff5148282bbbf11e6f2460829eab772cf2 # v1.9
        with:
          go-version-file: go.mod
          run-lint: "true"
          run-govulncheck: "true"

  # The release publishes a windows binary, so something has to run one.
  #
  # This leg covers what it honestly can: the build, vet, the two packages
  # that execute nothing -- detect only reads manifests, doctor is read-only
  # -- and a real invocation of the binary itself.
  #
  # It does NOT run internal/app. Those tests spawn sh, true and touch by
  # design, because the tool's whole contract is what a real process's status
  # and output do, and faking that boundary is ruled out by CONTRIBUTING. The
  # capture path is therefore verified on unix only, and saying so is better
  # than a green job that quietly skipped it.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: Rethunk-Tech/gh-actions/setup-go@45d60bff5148282bbbf11e6f2460829eab772cf2 # v1.9
        with:
          go-version-file: go.mod

      - name: build and vet
        run: |
          go build ./...
          go vet ./...

      - name: test the packages that execute nothing
        run: go test ./internal/detect/ ./internal/doctor/

      - name: smoke-test the binary
        shell: bash
        env:
          # Git Bash rewrites an argument that looks like a unix path before
          # the child ever sees it, so `cmd /c exit 3` arrives as
          # `cmd C:/ exit 3` -- which exits 0, and made a failing gate look
          # like a passing one. The conversion has to be off for a test whose
          # whole subject is the argv a child receives.
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          set -euo pipefail
          go build -o gate.exe ./cmd/gate
          ./gate.exe --version
          ./gate.exe --log pass.log cmd /c exit 0
          # The exit status is the verdict, so the interesting case is a
          # failing gate passing its own status through unchanged.
          if ./gate.exe --log fail.log cmd /c exit 3; then
            echo "a failing gate reported success"
            exit 1
          else
            status=$?
            [ "$status" = "3" ] || { echo "gate exited $status, want 3"; exit 1; }
          fi
          grep -q "exit 3" fail.log
          # The argument reached the child intact. Without this, path
          # conversion can come back and the status assertion above passes
          # for the wrong reason -- a different command that also exits 3.
          grep -q -- "/c" fail.log

  # One required check for branch protection to point at. Without it, a
  # matrix leg that never ran reads as "not failing" rather than "not run".
  gate:
    if: always()
    needs: [check, lint, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check did not succeed
        run: |
          if [ "${{ needs.check.result }}" != "success" ] \
            || [ "${{ needs.lint.result }}" != "success" ] \
            || [ "${{ needs.windows.result }}" != "success" ]; then
            echo "check=${{ needs.check.result }} lint=${{ needs.lint.result }} windows=${{ needs.windows.result }}"
            exit 1
          fi
          echo "all checks passed"
