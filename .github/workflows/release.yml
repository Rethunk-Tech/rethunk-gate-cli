name: Release

# Tag-triggered. Nothing here runs until the repository has a remote and a
# v-tag is pushed to it. There is deliberately no pull_request or
# workflow_run trigger: only someone who can already push a v-tag to this
# repository can start this, which is what bounds the write permission below.
on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Third-party actions are pinned by commit SHA with the version in a comment.
# A tag is a mutable pointer its owner can repoint, and these run in jobs that
# hold tokens worth stealing. Rethunk-Tech/gh-actions stays on a tag, which is
# fleet policy and what `gate doctor` advises for it.
jobs:
  # No contents: write in this job. It runs checkout, a shared action and the
  # build, and the token that can publish a release is deliberately not in
  # scope while any of that happens.
  build:
    name: cross-build and attest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Both are for the attestation step, and neither grants anything else:
      # id-token mints the short-lived OIDC token that proves the build ran
      # here, attestations writes the resulting record.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Rethunk-Tech/gh-actions/setup-go@45d60bff5148282bbbf11e6f2460829eab772cf2 # v1.9
        with:
          go-version-file: go.mod

      # One runner builds every artifact. gate is pure Go with no cgo, so
      # unlike rethunk-git-cli -- which needs a macOS runner for tree-sitter --
      # darwin cross-compiles here like any other target.
      - name: Cross-build
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            out="dist/gate-${goos}-${goarch}"
            if [ "$goos" = "windows" ]; then
              out="${out}.exe"
            fi
            echo "building $out"
            GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$out" ./cmd/gate
          done

      # Proof the artifact that ships actually runs, not just that it linked.
      # Only the native target can execute here; the rest are checked by type.
      - name: Verify artifacts
        run: |
          set -euo pipefail
          ./dist/gate-linux-amd64 --version
          ./dist/gate-linux-amd64 true
          for f in dist/gate-*; do
            file "$f"
          done

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum gate-* > SHA256SUMS
          cat SHA256SUMS

      # A checksum says the file did not change in transit; it says nothing
      # about where it came from. This records that these exact bytes were
      # built by this workflow, from this commit, and it is verifiable after
      # download with `gh attestation verify <file> --repo <owner>/<repo>`.
      # It runs here, in the job that built them, because that is what it
      # attests -- and before anything is published, so a release is never
      # left unattested.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/gate-*

      - name: Hand off the artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # The only job that can write to the repository, and it does nothing but
  # publish: no checkout, no toolchain, no build. The executable bit is lost
  # in the artifact round-trip, which does not matter -- release assets carry
  # no mode -- and the bytes, which SHA256SUMS and the attestation are about,
  # are preserved.
  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # Nothing is checked out here, so gh has no git remote to infer the
          # repository from.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for what changed." \
            dist/gate-* dist/SHA256SUMS
