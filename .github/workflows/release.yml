name: Release

# Tag-triggered. Nothing here runs until the repository has a remote and a
# v-tag is pushed to it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: cross-build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: Rethunk-Tech/gh-actions/setup-go@v1.7
        with:
          go-version-file: go.mod

      # One runner builds every artifact. gate is pure Go with no cgo, so
      # unlike rethunk-git-cli -- which needs a macOS runner for tree-sitter --
      # darwin cross-compiles here like any other target.
      - name: Cross-build
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            out="dist/gate-${goos}-${goarch}"
            if [ "$goos" = "windows" ]; then
              out="${out}.exe"
            fi
            echo "building $out"
            GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$out" ./cmd/gate
          done

      # Proof the artifact that ships actually runs, not just that it linked.
      # Only the native target can execute here; the rest are checked by type.
      - name: Verify artifacts
        run: |
          set -euo pipefail
          ./dist/gate-linux-amd64 --version
          ./dist/gate-linux-amd64 true
          for f in dist/gate-*; do
            file "$f"
          done

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum gate-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for what changed." \
            dist/gate-* dist/SHA256SUMS
