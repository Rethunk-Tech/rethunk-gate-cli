version: 2

# Grouped so a week's updates arrive as one PR per ecosystem rather than one
# per module. The gate BINARY is still stdlib only -- nothing third-party is
# linked into what ships -- but the test suite uses go-quicktest/qt, so go.mod
# and go.sum are no longer empty and this entry now has real work to do.
#
# Fleet policy: Dependabot PRs are not merged. The equivalent bump is applied
# by hand on main and the PR closed as superseded.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
