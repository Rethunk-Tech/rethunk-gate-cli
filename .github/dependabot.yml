version: 2

# Grouped so a week's updates arrive as one PR per ecosystem rather than one
# per module. gate was stdlib only until 0.2.0; it now links go-toml for the
# per-project configuration file, and uses go-quicktest/qt in tests, so this
# entry has real work to do -- and one of the two ships in the binary.
#
# Fleet policy: Dependabot PRs are not merged. The equivalent bump is applied
# by hand on main and the PR closed as superseded.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
